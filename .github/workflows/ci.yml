name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify module checksums
        run: go mod verify
      - name: Dependency vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Browser dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm audit --audit-level=high
      - name: Browser workflow
        run: npm run test:browser
      - name: Click feedback budget
        run: THESES_BROWSER_TEST=1 THESES_BROWSER_SCRIPT=../../web/browser_perf.mjs THESES_ENFORCE_CLICK_BUDGET=1 go test ./internal/server -run '^TestBrowserWorkflow$' -count=1 -v
      - name: Workspace performance baseline
        run: go test ./internal/search -run '^$' -bench BenchmarkWorkspace -benchmem -count=3
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The browser modules are read by nothing else in this gate, and a name
      # that collides across two imports breaks the page at load rather than in
      # a test. Reading each file on stdin as a module is what catches that:
      # `node --check <file.js>` parses it as a script and lets it through.
      - name: node --check the browser modules and test the pure ones
        run: |
          for f in $(find web/static -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
          node --test web/*_test.mjs
      - run: go test ./...
      - name: go test -race on the concurrent packages
        if: github.event_name == 'pull_request'
        run: go test -race ./internal/realtime/ ./internal/core/ ./internal/notify/ ./internal/backup/ ./internal/files/ ./internal/workflow/
      - name: go test -race
        if: github.event_name == 'push'
        run: go test -race ./...
