name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The browser modules are read by nothing else in this gate, and a name
      # that collides across two imports breaks the page at load rather than in
      # a test. Reading each file on stdin as a module is what catches that:
      # `node --check <file.js>` parses it as a script and lets it through.
      - name: node --check the browser modules and test the pure ones
        run: |
          for f in $(find web/static -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
          node --test web/*_test.mjs
      - run: go test ./...
      # The race detector cannot run on the machine these branches are written
      # on, so the hub and the command bus, which are where the goroutines are,
      # are raced on the pull request rather than first on main.
      - name: go test -race on the concurrent packages
        if: github.event_name == 'pull_request'
        run: go test -race ./internal/realtime/ ./internal/core/
      - name: go test -race
        if: github.event_name == 'push'
        run: go test -race ./...
