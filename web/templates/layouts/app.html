{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · THESES</title>
<link rel="icon" href="{{asset "icon.svg"}}">
<link rel="stylesheet" href="{{asset "app.css"}}">
<meta name="csrf" content="{{.CSRF}}">
</head><body class="dirB{{if .Plain}} plain{{end}}">
<header id="top">
  {{if not .Plain}}<button id="railtoggle" aria-label="Propositions">≡</button>{{end}}
  <a class="brand" href="/">THESES</a><span class="show">{{.Workspace}}</span>
  {{if not .Plain}}<button class="search" type="button"><span>Search, jump, do…</span><kbd>⌘K</kbd></button>
  <div class="presence"></div>{{end}}
  {{if .IsOwner}}<a class="setgs" href="/settings">Settings</a>{{end}}
  <a class="acct" href="/profile">{{template "initials" .User}}<span>{{firstName .User.Name}}</span></a>
</header>
{{if not .Plain}}<aside id="rail"></aside>{{end}}
{{template "content" .}}
<script src="{{asset "app.js"}}" defer></script>
{{block "scripts" .}}{{end}}
</body></html>
{{end}}
