{{define "content"}}<div class="split">
  {{template "art" .ArtFrames}}
  <div class="panel">
    <div class="top"><span class="brand">THESES</span><span class="sm dim">{{.Workspace}}</span></div>
    <form class="mid" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <h1>Sign in.</h1>
      {{template "notice" .}}
      <label class="f"><span class="l sm">Account name</span><input name="handle" value="{{.Handle}}" autocomplete="username" spellcheck="false" autofocus required></label>
      <label class="f"><span class="l sm row">Password <a class="lnk quiet" href="/reset">Forgot it</a></span><input type="password" name="password" autocomplete="current-password" required></label>
      <label class="f"><span class="l sm">Authenticator code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digits" maxlength="6"></label>
      <button class="btn" type="submit" data-busy="Signing in">Sign in</button>
    </form>
    <div class="bot"><span class="mono">No account? Ask an owner for an invitation.</span></div>
  </div>
</div>{{end}}
